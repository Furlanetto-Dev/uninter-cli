[project]
name = "uninter"
version = "0.1.0"
description = "CLI interativa para consultar avaliações do AVA da Uninter"
authors = [
    {name = "furlanetto-dev",email = "dev@furlanetto.me"},
]
dependencies = [
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "rich>=13.7",
    "textual>=8.2.8",
    "aiosqlite>=0.22.1",
]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[tool.pdm.scripts]
start = {cmd = "python src/main.py", help = "Abre a CLI interativa de avaliações"}
test = {cmd = "pytest", help = "Roda a suíte de testes"}


[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"


[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
